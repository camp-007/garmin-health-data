name: Publish to PyPI

on:
  release:
    types: [created]

jobs:
  publish:
    # This workflow is inherited by public forks. Only the upstream repository owns
    # the PyPI project and its release credential; fork releases are ordinary GitHub
    # artifacts and must never attempt a PyPI upload.
    if: github.repository == 'diegoscarabelli/garmin-health-data'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
