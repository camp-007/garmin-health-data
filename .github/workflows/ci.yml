name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-and-format:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies and check formatting
      run: |
        make venv
        baseline="$(git tag --list 'tc-extractor-*' --sort=-creatordate | head -n 1)"
        baseline="${baseline:-9c84373e6ef779bbbbffbb0277bbe9e721f94320}"
        changed_python="$(git diff --name-only --diff-filter=ACMR "$baseline"...HEAD -- '*.py')"
        if [ -n "$changed_python" ]; then
          .venv/bin/python -m autoflake --check $changed_python
          .venv/bin/python -m docformatter --check $changed_python
          .venv/bin/python -m black --check $changed_python
        fi
        .venv/bin/python -m sqlfluff lint --disable-progress-bar --processes 0

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests with coverage
      run: |
        pytest tests/ -v --cov=garmin_health_data --cov-report=term-missing
